<!DOCTYPE html>
<html>
<head>
    <title>Linux Security Audit Framework</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-top: 0; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #667eea; padding-bottom: 20px; }
        .stats { display: flex; justify-content: space-around; margin: 30px 0; flex-wrap: wrap; gap: 15px; }
        .stat-card { text-align: center; padding: 20px; background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%); border-radius: 15px; min-width: 150px; }
        .stat-number { font-size: 36px; font-weight: bold; color: #667eea; }
        .buttons { text-align: center; margin: 30px 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover { transform: translateY(-2px); }
        .progress-bar {
            width: 100%;
            height: 35px;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
            margin: 25px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            color: white;
            text-align: center;
            line-height: 35px;
            font-weight: bold;
        }
        .score-box {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin: 25px 0;
        }
        .score { font-size: 56px; font-weight: bold; }
        .finding {
            border-left: 5px solid;
            padding: 15px;
            margin: 15px 0;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .HIGH { border-color: #dc3545; }
        .MEDIUM { border-color: #ffc107; }
        .LOW { border-color: #28a745; }
        .severity { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-right: 12px; }
        .severity-HIGH { background: #dc3545; color: white; }
        .severity-MEDIUM { background: #ffc107; color: black; }
        .severity-LOW { background: #28a745; color: white; }
        .status { text-align: center; padding: 12px; border-radius: 10px; margin: 20px 0; font-weight: bold; }
        .running { background: #fff3cd; color: #856404; }
        .completed { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .cve-item { padding: 10px; margin: 8px 0; background: #f0f0f0; border-radius: 8px; border-left: 4px solid #dc3545; }
        .fix-code { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 8px; margin-top: 12px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Linux Security Audit Framework</h1>
            <p><strong>Nassim Ammar</strong> | Pentest & Audit Interne | PFA 2025-2026</p>
        </div>
        
        <div class="stats">
            <div class="stat-card"><div class="stat-number">50+</div><div>Security Checks</div></div>
            <div class="stat-card"><div class="stat-number" id="cveCount">0</div><div>CVEs Detected</div></div>
            <div class="stat-card"><div class="stat-number">~30s</div><div>Scan Duration</div></div>
        </div>
        
        <div class="score-box">
            <div>📊 Security Score</div>
            <div class="score" id="score">--</div>
            <div id="grade" style="font-size: 20px;"></div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress">0%</div>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="buttons">
            <button onclick="startFullScan()">🚀 FULL SCAN</button>
            <button onclick="startQuickScan()">⚡ QUICK SCAN</button>
            <button onclick="startCVEScan()">🐛 CVE SCAN</button>
            <button onclick="downloadReport()">📥 DOWNLOAD REPORT</button>
        </div>
        
        <h3>⚠️ Security Findings</h3>
        <div id="findings">Click a button to start scanning</div>
        
        <h3>🐛 CVE Vulnerabilities</h3>
        <div id="cves">No CVE scan performed yet</div>
    </div>
    
    <script>
        let updateInterval = null;
        
        function startFullScan() { startScan('/api/full-scan', 'FULL SCAN'); }
        function startQuickScan() { startScan('/api/quick-scan', 'QUICK SCAN'); }
        function startCVEScan() { startScan('/api/cve-scan', 'CVE SCAN'); }
        
        function startScan(url, type) {
            fetch(url, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'started') {
                        document.getElementById('status').innerHTML = `<div class="status running">🔄 ${type} in progress...</div>`;
                        if (updateInterval) clearInterval(updateInterval);
                        updateInterval = setInterval(checkStatus, 2000);
                    }
                });
        }
        
        function checkStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('progress').style.width = data.progress + '%';
                    document.getElementById('progress').textContent = data.progress + '%';
                    document.getElementById('score').textContent = data.score || '--';
                    document.getElementById('grade').textContent = data.grade || '';
                    document.getElementById('cveCount').textContent = data.cves ? data.cves.length : 0;
                    
                    if (data.findings && data.findings.length > 0) {
                        let html = '';
                        data.findings.forEach(f => {
                            html += `<div class="finding ${f.severity}">
                                        <span class="severity severity-${f.severity}">${f.severity}</span>
                                        <strong>${f.title}</strong>
                                        <div class="fix-code">🔧 ${f.fix}</div>
                                     </div>`;
                        });
                        document.getElementById('findings').innerHTML = html;
                    }
                    
                    if (data.cves && data.cves.length > 0) {
                        let html = '';
                        data.cves.forEach(c => {
                            html += `<div class="cve-item">❌ <strong>${c.package}</strong>: ${c.count} known vulnerabilities</div>`;
                        });
                        document.getElementById('cves').innerHTML = html;
                    }
                    
                    if (data.status === 'completed') {
                        clearInterval(updateInterval);
                        document.getElementById('status').innerHTML = '<div class="status completed">✅ Scan completed!</div>';
                    } else if (data.status === 'error') {
                        clearInterval(updateInterval);
                        document.getElementById('status').innerHTML = '<div class="status error">❌ Scan failed</div>';
                    }
                });
        }
        
        function downloadReport() {
            window.location.href = '/api/download';
        }
    </script>
</body>
</html>
